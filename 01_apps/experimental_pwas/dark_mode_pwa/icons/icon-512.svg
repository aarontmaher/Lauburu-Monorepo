<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />
  
  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f2937" stroke-width="6" stroke-dasharray="16 12" />
  
  <!-- Crescent Moon Symbol with Glow -->
  <path d="M 296 140 A 136 136 0 1 0 372 340 A 156 156 0 0 1 296 140 Z" fill="url(#moonGrad)" filter="url(#glow)" />
  
  <!-- Central Mesh Signal Stars -->
  <circle cx="360" cy="180" r="14" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="395" cy="235" r="9" fill="#10b981" />
  <circle cx="350" cy="290" r="11" fill="#38bdf8" />
</svg>
