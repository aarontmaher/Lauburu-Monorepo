<style>
  .infra-container { display: flex; height: 80vh; background: #111; color: #fff; font-family: monospace; }
  .infra-sidebar { width: 250px; background: #1a1a1a; padding: 10px; border-right: 1px solid #333; }
  .infra-btn { display: block; width: 100%; padding: 12px; margin-bottom: 5px; background: #222; border: 1px solid #444; color: #00ffcc; cursor: pointer; text-align: left; transition: 0.2s; }
  .infra-btn:hover, .infra-btn.active { background: #00ffcc; color: #000; }
  .infra-btn.external { color: #ff00ff; border-color: #550055; }
  .infra-viewer { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  iframe { width: 100%; height: 100%; border: none; }
</style>

<div class="infra-container">
  <!-- Sidebar Navigation -->
  <div class="infra-sidebar">
    <h3 style="color: #fff; padding-left: 10px;">Lauburu Infra Hub</h3>
    <button class="infra-btn active" onclick="loadInfra('http://127.0.0.1:8888', this)">🧠 Obsidian Brain</button>
    <button class="infra-btn" onclick="loadInfra('http://192.168.8.230:4000/proxy/router/', this)">🌐 GL.iNet Router</button>
    <button class="infra-btn" onclick="loadInfra('http://127.0.0.1:9000', this)">🐳 Docker (Portainer)</button>
    <button class="infra-btn" onclick="loadInfra('http://127.0.0.1:8384', this)">🔄 Syncthing</button>
    <button class="infra-btn" onclick="loadInfra('http://127.0.0.1:8080', this)">🦙 Llama.cpp VRAM</button>
    <button class="infra-btn" style="color: #ffaa00; border-color: #aa5500;" onclick="loadInfra('http://127.0.0.1:5050', this)">⚡ Shadow Benchmark</button>
    
    <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 10px;"></div>
    <button class="infra-btn external" onclick="window.open('https://one.dash.cloudflare.com', '_blank')">🛡️ Cloudflare (Pop-out)</button>
    <button class="infra-btn external" onclick="window.open('https://login.tailscale.com/admin/machines', '_blank')">🕸️ Tailscale (Pop-out)</button>
  </div>

  <!-- Lazy Loaded iFrame Viewer -->
  <div class="infra-viewer" id="infra-viewer">
    <iframe id="infra-frame" src="http://127.0.0.1:8888"></iframe>
  </div>
</div>

<script>
  function loadInfra(url, buttonElement) {
    // Update active button state
    document.querySelectorAll('.infra-btn:not(.external)').forEach(btn => btn.classList.remove('active'));
    buttonElement.classList.add('active');

    // Lazy load the iframe to save RAM
    const frame = document.getElementById('infra-frame');
    frame.src = url;
  }
</script>
