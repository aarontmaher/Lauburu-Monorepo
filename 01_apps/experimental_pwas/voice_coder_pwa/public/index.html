<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voice Coder PWA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #mic-btn {
            background-color: #bb86fc;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        #mic-btn.listening {
            background-color: #cf6679;
            transform: scale(1.1);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(207, 102, 121, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(207, 102, 121, 0); }
            100% { box-shadow: 0 0 0 0 rgba(207, 102, 121, 0); }
        }
        #transcript {
            margin-top: 2rem;
            font-size: 1.2rem;
            min-height: 2rem;
            padding: 0 20px;
            color: #e0e0e0;
        }
        #status-card {
            margin-top: 2rem;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 400px;
            display: none;
        }
        h3 { margin-top: 0; color: #bb86fc; }
        .diff-stats { font-weight: bold; color: #03dac6; margin-top: 10px; }
    </style>
</head>
<body>

    <button id="mic-btn">🎙️</button>
    <div id="transcript">Tap the mic and speak...</div>

    <div id="status-card">
        <h3 id="card-title"></h3>
        <p id="card-summary"></p>
        <div class="diff-stats" id="card-stats"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }

        const micBtn = document.getElementById('mic-btn');
        const transcriptEl = document.getElementById('transcript');
        const statusCard = document.getElementById('status-card');
        const cardTitle = document.getElementById('card-title');
        const cardSummary = document.getElementById('card-summary');
        const cardStats = document.getElementById('card-stats');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            transcriptEl.textContent = "Speech Recognition API not supported in this browser.";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            let isListening = false;

            micBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                    return;
                }
                recognition.start();
                micBtn.classList.add('listening');
                transcriptEl.textContent = "Listening...";
                statusCard.style.display = 'none';
                isListening = true;
            });

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                transcriptEl.textContent = `You said: "${text}"`;
                sendToAgent(text);
            };

            recognition.onspeechend = () => {
                recognition.stop();
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                isListening = false;
            };

            recognition.onerror = (event) => {
                transcriptEl.textContent = `Error: ${event.error}`;
                micBtn.classList.remove('listening');
                isListening = false;
            };
        }

        async function sendToAgent(prompt) {
            try {
                transcriptEl.textContent += " (Sending to orchestrator...)";
                const response = await fetch('/api/voice-command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                
                if (data.android_auto_card) {
                    statusCard.style.display = 'block';
                    cardTitle.textContent = data.android_auto_card.title;
                    cardSummary.textContent = data.android_auto_card.summary;
                    const stats = data.android_auto_card.diff_stats;
                    if (stats && (stats.added > 0 || stats.deleted > 0)) {
                        cardStats.textContent = `+${stats.added} | -${stats.deleted} (Files: ${stats.files})`;
                    } else {
                        cardStats.textContent = data.android_auto_card.status;
                    }

                    // TTS playback of the response
                    if (data.spoken_response) {
                        const utterance = new SpeechSynthesisUtterance(data.spoken_response);
                        window.speechSynthesis.speak(utterance);
                    }
                }
            } catch (err) {
                transcriptEl.textContent = "Error connecting to mesh orchestrator.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
