[package]
name = "prima-tui"
version = "0.1.0"
edition = "2021"
description = "prima.cpp Ring Monitor & 5-Framework Benchmark TUI for Lauburu Mesh"

[[bin]]
name = "prima-tui"
path = "src/main.rs"

[dependencies]
ratatui    = "0.29"
crossterm  = { version = "0.28", features = ["event-stream"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
futures    = "0.3"
anyhow     = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
