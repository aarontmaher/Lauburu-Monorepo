[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canonical_tui_python"
version = "2.0.0"
description = "Canonical Lauburu Textual Cloud API Quota & Telemetry HUD"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
canonical-tui-python = "app:main"
