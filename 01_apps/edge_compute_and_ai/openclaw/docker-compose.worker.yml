version: '3.8'

services:
  openclaw-worker:
    build:
      context: .
      dockerfile: Dockerfile.openclaw-worker
    container_name: openclaw-worker-node1
    privileged: true  # Required for tailscaled to create the tun interface if not using userspace networking
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    # devices:
    #   - /dev/net/tun
    environment:
      - HEADSCALE_URL=http://<YOUR_HEADSCALE_SERVER_IP>:8080
      - TAILSCALE_AUTH_KEY=<YOUR_AUTH_KEY>
      - RPC_PORT=50052
    ports:
      - "50052:50052"
    restart: unless-stopped
    # Uncomment the following to enable NVIDIA GPU passthrough for llama-rpc-server
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
