[package]
name = "lauburu_network_lens"
version = "1.0.0"
edition = "2021"
authors = ["Aaron Maher <aarontmaher@gmail.com>", "Lauburu AI Mesh Team"]
description = "High-Performance Reverse-Engineered WhatCable & Wireshark Terminal Network Analyzer in Rust"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
