[package]
name = "lauburu_port4000_core"
version = "0.1.0"
edition = "2021"
authors = ["Aaron Maher <aaron@lauburu.ai>"]
description = "Lauburu Port 4000 Core Engine: High-performance Biometrics DSP, Pan-Tompkins QRS, Movesense BLE, Shopify Tier validation, and Axum/Tokio HTTP/WebSocket Server with Flutter Rust Bridge (FFI) exports."

[lib]
name = "lauburu_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "port4000_server"
path = "src/bin/main.rs"

[[bin]]
name = "sovereign_server"
path = "src/bin/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
parking_lot = "0.12"
btleplug = "0.13.0"
uuid = { version = "1.10", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
