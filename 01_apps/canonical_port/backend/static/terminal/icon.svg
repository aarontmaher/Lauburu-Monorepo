<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Terminal Window Header Bar -->
  <rect x="32" y="32" width="448" height="64" rx="20" fill="#1f2430" fill-opacity="0.8"/>
  <circle cx="70" cy="64" r="10" fill="#ff5f56"/>
  <circle cx="102" cy="64" r="10" fill="#ffbd2e"/>
  <circle cx="134" cy="64" r="10" fill="#27c93f"/>

  <!-- Title -->
  <text x="256" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="600" letter-spacing="2">OMNITERMINAL</text>

  <!-- Terminal Prompt Symbol >_ -->
  <g filter="url(#glow)">
    <path d="M 100 180 L 220 270 L 100 360" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="260" y1="360" x2="400" y2="360" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- Mesh Node Dots (7 Layers) -->
  <circle cx="120" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="165" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="210" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="255" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="300" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="345" cy="430" r="12" fill="#00e5ff"/>
  <circle cx="390" cy="430" r="12" fill="#ff007f"/>
</svg>
