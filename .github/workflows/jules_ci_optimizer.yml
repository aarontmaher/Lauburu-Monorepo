name: Google Jules Repository CI & Speculation Optimizer

on:
  push:
    branches: [ main, master, jules-* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  jules-speculation-and-benchmark:
    name: Jules Local Speculation & Config Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 google-genai google-auth tenacity sniffio distro

      - name: Run Jules Environment Setup Script
        run: |
          chmod +x .jules/setup.sh
          ./.jules/setup.sh

      - name: Run Local Speculation Practice Engine
        run: |
          python3 06_scripts_and_tooling/jules/jules_config_and_speculation_engine.py --run-optimization --benchmark -v

      - name: Execute Jules Unit & Integration Tests
        run: |
          python3 -m pytest 06_scripts_and_tooling/jules/tests/ -v

      - name: Verify Rule #0 Zero-Mock & Config Integrity
        run: |
          python3 06_scripts_and_tooling/jules/jules_config_and_speculation_engine.py --verify-config
