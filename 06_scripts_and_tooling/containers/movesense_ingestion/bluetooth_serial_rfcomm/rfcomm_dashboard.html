<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Serial / RFCOMM Terminal Browser</title>
    <style>
        :root {
            --bg: #090c10;
            --panel: #161b22;
            --border: #30363d;
            --amber: #d29922;
            --green: #3fb950;
            --blue: #58a6ff;
            --text: #c9d1d9;
        }
        body {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--amber);
        }
        .term {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            height: 380px;
            overflow-y: auto;
            color: #7ee787;
            font-size: 0.85rem;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .input-bar {
            display: flex;
            gap: 12px;
        }
        input[type="text"] {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--blue);
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <div class="title">Bluetooth RFCOMM Serial Browser</div>
                <div style="font-size: 0.8rem; color: #8b949e; margin-top: 4px;">
                    Zero-Infrastructure SPP Serial Telemetry Console (Port 8089)
                </div>
            </div>
            <div id="connState" style="color: #8b949e; font-size: 0.85rem;">Connecting...</div>
        </header>

        <div class="term" id="terminal"></div>

        <div class="input-bar">
            <input type="text" id="cmdInput" placeholder="Enter AT command or serial payload (e.g. /Meas/Acc/52)..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const term = document.getElementById('terminal');
        const cmdInput = document.getElementById('cmdInput');
        const sendBtn = document.getElementById('sendBtn');
        const connState = document.getElementById('connState');

        function appendLine(text, color = '#7ee787') {
            const span = document.createElement('span');
            span.style.color = color;
            span.textContent = text + '\n';
            term.appendChild(span);
            term.scrollTop = term.scrollHeight;
        }

        const ws = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/serial');

        ws.onopen = () => {
            connState.textContent = 'Bridge Online';
            connState.style.color = '#3fb950';
            appendLine('[System] WebSocket connection established to RFCOMM bridge.', '#58a6ff');
        };

        ws.onclose = () => {
            connState.textContent = 'Bridge Offline';
            connState.style.color = '#f85149';
            appendLine('[System] Connection lost.', '#f85149');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'system') {
                appendLine(data.message, '#58a6ff');
            } else if (data.type === 'data') {
                appendLine(`[RX] ${data.raw}`);
            } else if (data.type === 'error') {
                appendLine(`[Error] ${data.message}`, '#f85149');
            }
        };

        function sendCommand() {
            const cmd = cmdInput.value.trim();
            if (!cmd) return;
            appendLine(`[TX] ${cmd}`, '#d29922');
            ws.send(JSON.stringify({ action: 'command', command: cmd }));
            cmdInput.value = '';
        }

        sendBtn.addEventListener('click', sendCommand);
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendCommand();
        });
    </script>
</body>
</html>
