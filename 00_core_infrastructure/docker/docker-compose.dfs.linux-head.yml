version: '3.8'

# ==============================================================================
# LAUBURU DFS MASTER GATEWAY NODE 3: LINUX HEAD NODE
# Hardware: AMD Ryzen 7 5700U (Debian/Ubuntu x86_64), 16.0 GB RAM (AI Cap: 13.8 GB)
# Storage Contributed: 848 GiB (/mnt/ssd_1tb NVMe)
# Network: Tailscale 100.101.39.98 / 2.5GbE LAN 192.168.8.224
# Memory Cap: Strict ≤512MB Total Combined (75% System Ceiling Compliant)
# Exposes Unified Additive Pool as smb://100.101.39.98/nas
# Raft Quorum: 3-Node Consensus (100.101.39.98, 100.119.199.76, 100.103.212.21)
# ==============================================================================

services:
  dfs_master:
    image: chrislusf/seaweedfs:latest
    container_name: lauburu_dfs_master
    hostname: linux-head-dfs-master
    restart: unless-stopped
    command: >
      master
      -ip=100.101.39.98
      -port=9333
      -port.grpc=19333
      -mdir=/data/dfs_master
      -volumeSizeLimitMB=1024
      -defaultReplication=000
      -peers=100.101.39.98:9333,100.119.199.76:9333,100.103.212.21:9333
      -electionTimeout=2s
      -heartbeatInterval=200ms
      -telemetry=false
    volumes:
      - /mnt/ssd_1tb/dfs_master:/data/dfs_master:rw
    ports:
      - "100.101.39.98:9333:9333"
      - "100.101.39.98:19333:19333"
      - "192.168.8.224:9333:9333"
      - "192.168.8.224:19333:19333"
    mem_limit: 128m
    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '1.0'
        reservations:
          memory: 32M
    labels:
      com.lauburu.dfs.service: "dfs-master"
      com.lauburu.dfs.tier: "core_wall_powered"
      com.lauburu.dfs.node: "Linux_Head_Node"
      com.lauburu.dfs.node_id: "Node_3_Linux_Head"
      com.lauburu.dfs.arch: "amd64"
      com.lauburu.dfs.ram_cap: "128m"
      com.lauburu.dfs.mcp_managed: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/dir/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dfs_filer:
    image: chrislusf/seaweedfs:latest
    container_name: lauburu_dfs_filer
    hostname: linux-head-dfs-filer
    restart: unless-stopped
    command: >
      filer
      -master=100.101.39.98:9333,100.119.199.76:9333,100.103.212.21:9333
      -ip=100.101.39.98
      -port=8888
      -port.grpc=18888
      -defaultReplicaPlacement=000
      -defaultStoreDir=/data/dfs_filer
    volumes:
      - /mnt/ssd_1tb/dfs_filer:/data/dfs_filer:rw
    ports:
      - "100.101.39.98:8888:8888"
      - "100.101.39.98:18888:18888"
      - "192.168.8.224:8888:8888"
      - "192.168.8.224:18888:18888"
    mem_limit: 128m
    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '1.0'
        reservations:
          memory: 32M
    depends_on:
      - dfs_master
    labels:
      com.lauburu.dfs.service: "dfs-filer"
      com.lauburu.dfs.tier: "core_wall_powered"
      com.lauburu.dfs.node: "Linux_Head_Node"
      com.lauburu.dfs.node_id: "Node_3_Linux_Head"
      com.lauburu.dfs.arch: "amd64"
      com.lauburu.dfs.ram_cap: "128m"
      com.lauburu.dfs.mcp_managed: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8888/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dfs_local_volume:
    image: chrislusf/seaweedfs:latest
    container_name: lauburu_dfs_linux_volume
    hostname: linux-head-dfs-volume
    restart: unless-stopped
    command: >
      volume
      -master=100.101.39.98:9333,100.119.199.76:9333,100.103.212.21:9333
      -port=8080
      -port.grpc=18080
      -ip=100.101.39.98
      -dir=/data/dfs_bricks
      -max=50
      -minFreeSpacePercent=5
      -publicUrl=100.101.39.98:8080
    volumes:
      - /mnt/ssd_1tb/dfs_bricks:/data/dfs_bricks:rw
    ports:
      - "100.101.39.98:8080:8080"
      - "100.101.39.98:18080:18080"
      - "192.168.8.224:8080:8080"
      - "192.168.8.224:18080:18080"
    mem_limit: 128m
    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '1.0'
        reservations:
          memory: 32M
    depends_on:
      - dfs_master
    labels:
      com.lauburu.dfs.service: "volume-brick"
      com.lauburu.dfs.tier: "core_wall_powered"
      com.lauburu.dfs.node: "Linux_Head_Node"
      com.lauburu.dfs.node_id: "Node_3_Linux_Head"
      com.lauburu.dfs.arch: "amd64"
      com.lauburu.dfs.ram_cap: "128m"
      com.lauburu.dfs.capacity_gb: "848"
      com.lauburu.dfs.mcp_managed: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  samba_gateway:
    image: dperson/samba:latest
    container_name: samba_nas_gateway
    hostname: lauburu-samba-gateway
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - WORKGROUP=WORKGROUP
      - SERVERSTRING=Lauburu 1.701TB Unified DFS NAS
      - NMBD=true
    volumes:
      - /mnt/dfs_unified:/mnt/nas:rw
      - /Volumes/Lauburu-Monorepo/smb_pool_config.conf:/etc/samba/smb.conf:ro
    ports:
      - "100.101.39.98:445:445/tcp"
      - "100.101.39.98:139:139/tcp"
      - "192.168.8.224:445:445/tcp"
      - "192.168.8.224:139:139/tcp"
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    labels:
      com.lauburu.dfs.service: "samba-smb3-gateway"
      com.lauburu.dfs.tier: "core_wall_powered"
      com.lauburu.dfs.node: "Linux_Head_Node"
      com.lauburu.dfs.node_id: "Node_3_Linux_Head"
      com.lauburu.dfs.arch: "amd64"
      com.lauburu.dfs.ram_cap: "256m"
      com.lauburu.dfs.mcp_managed: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 445 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  default:
    name: lauburu_dfs_net
    driver: bridge
