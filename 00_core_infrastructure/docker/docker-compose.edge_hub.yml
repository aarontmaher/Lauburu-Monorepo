version: '3.8'

services:
  edge-hub:
    build:
      context: .
      dockerfile: Dockerfile.edge_hub
    image: lauburu-edge-hub:latest
    container_name: lauburu_edge_hub
    restart: unless-stopped
    network_mode: "host" # Required for BlueZ DBus BLE discovery and low-latency RPC
    volumes:
      - /var/run/dbus:/var/run/dbus:ro # Bluetooth DBus socket passthrough
    environment:
      - HUB_PORT=8086
      - LOCAL_AI_GATEWAY_URL=http://127.0.0.1:8181
      - ENABLE_BLE_SCAN=true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M # Conservative 75% memory ceiling rule
