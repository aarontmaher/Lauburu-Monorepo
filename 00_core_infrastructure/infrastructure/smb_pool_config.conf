# ==============================================================================
# LAUBURU HIGH-PERFORMANCE SAMBA (SMB3) WITH APPLE VFS FRUIT CONFIGURATION
# Gateway Host: Linux Head Node (100.101.39.98 / 192.168.8.224)
# Target Share URI: smb://100.101.39.98/nas
# Purpose: Single Unified 1.701 TB - 2.60 TB Additive Storage Pool for macOS Finder
# ==============================================================================

[global]
   workgroup = WORKGROUP
   server string = Lauburu 1.701TB Unified Distributed DFS NAS
   security = user
   map to guest = Bad User
   usershare allow guests = yes
   min protocol = SMB2
   max protocol = SMB3
   ea support = yes
   store dos attributes = yes
   map archive = no
   map hidden = no
   map read only = no
   map system = no

   # TCP Buffer & High-Throughput Tuning
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384

   # Apple macOS VFS Fruit Modules & Extended Attributes
   vfs objects = catia fruit streams_xattr
   fruit:aapl = yes
   fruit:metadata = stream
   fruit:model = Macpro
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:zero_file_id = yes
   fruit:encoding = native
   fruit:time machine = no
   streams_xattr:store_stream_type = no
   streams_xattr:prefix = user.

[nas]
   comment = Lauburu Unified Aggregated Distributed Storage Pool (1.701 TB)
   path = /mnt/nas
   read only = no
   writeable = yes
   browseable = yes
   guest ok = yes
   guest only = yes
   force user = linux
   force group = linux
   create mask = 0777
   directory mask = 0777
   force create mode = 0775
   force directory mode = 0775
   spotlight = no

[SSD]
   comment = Lauburu Fast SSD Storage Pool (Direct NVMe Gateway)
   path = /mnt/nas
   read only = no
   writeable = yes
   browseable = yes
   guest ok = yes
   guest only = yes
   force user = linux
   force group = linux
   create mask = 0777
   directory mask = 0777
   force create mode = 0775
   force directory mode = 0775
   spotlight = no