version: '3.8'

services:
  nfs-server:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: lauburu_nfs_core
    restart: always
    privileged: true
    environment:
      - SHARED_DIRECTORY=/data
    volumes:
      - /Volumes/aaronmaher/Lauburu-Monorepo/data:/data
    ports:
      - "2049:2049"
    deploy:
      resources:
        limits:
          memory: 2G # Respecting the 75% RAM limit for local AI
    networks:
      - thunderbolt_mesh

networks:
  thunderbolt_mesh:
    driver: bridge
